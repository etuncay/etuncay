<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chat Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/responsive.css" />
  <script src="https://kit.fontawesome.com/a2e0e6ad1b.js" crossorigin="anonymous"></script>
</head>
<body class="bg-neutral-900 text-neutral-100 min-h-screen flex">
  <aside class="w-64 bg-neutral-950 hidden md:flex flex-col border-r border-neutral-800">
    <div class="p-4 font-semibold">RAG Chat</div>
    <nav class="flex-1 p-2 space-y-1">
      <a href="/index.html" class="block px-3 py-2 rounded hover:bg-neutral-800">Sohbet</a>
      <a href="/workspaces.html" class="block px-3 py-2 rounded hover:bg-neutral-800">Workspaces</a>
      <a href="/threads.html" class="block px-3 py-2 rounded hover:bg-neutral-800">Threads</a>
      <a href="/upload.html" class="block px-3 py-2 rounded hover:bg-neutral-800">Dosya Yükleme</a>
    </nav>
  </aside>

  <main class="flex-1 flex flex-col">
    <header class="p-3 border-b border-neutral-800 flex items-center gap-2">
      <button id="toggleSidebar" class="md:hidden px-2 py-1 rounded bg-neutral-800"><i class="fa-solid fa-bars"></i></button>
      <div class="font-semibold">Sohbet</div>
      <div class="ml-auto flex items-center gap-2">
        <select id="workspaceSelect" class="bg-neutral-800 rounded px-2 py-1"></select>
        <select id="promptSelect" class="bg-neutral-800 rounded px-2 py-1"></select>
      </div>
    </header>

    <section id="messages" class="flex-1 overflow-y-auto p-4 space-y-4">
      <!-- Messages will render here -->
    </section>

    <footer class="p-3 border-t border-neutral-800">
      <form id="chatForm" class="flex gap-2">
        <input id="messageInput" class="flex-1 bg-neutral-800 rounded px-3 py-2" placeholder="Bir şey sor..." />
        <button class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded">Gönder</button>
      </form>
    </footer>
  </main>

  <script src="/assets/js/main.js"></script>
</body>
</html>
